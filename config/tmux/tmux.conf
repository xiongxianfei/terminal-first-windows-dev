# ~/.tmux.conf
# Best-practice tmux config for Ubuntu / WSL / Windows Terminal
# Based on tmux 3.4 and outer TERM=xterm-256color.

##### Prompt/copy mode keys #####

setw -g mode-keys vi
set -g status-keys emacs

##### Terminal / color / capabilities #####

# Inside tmux, TERM should be tmux-like, not xterm-like.
set -g default-terminal "tmux-256color"

# Reset terminal-features first so repeated `source-file ~/.tmux.conf`
# does not create duplicate entries.
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys"

# Your outer terminal reports xterm-256color. Add RGB true-color support for it.
set -as terminal-features ",xterm-256color:RGB"

# Clipboard through OSC 52. `external` is safer than `on`.
set -s set-clipboard external

# If OSC 52 clipboard does not work in WSL/Windows Terminal, comment out the
# set-clipboard line above and uncomment these three fallback lines:
# set -s set-clipboard off
# set -s copy-command "clip.exe"
# bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

##### Core usability #####

set -g mouse on
set -g history-limit 50000
set -g renumber-windows on

# Start numbering at 1.
set -g base-index 1
setw -g pane-base-index 1

# Snappier Esc/Alt behavior. Raise to 50-100 if Alt feels flaky over SSH.
set -sg escape-time 10

# Useful for editors that react to terminal focus changes.
set -g focus-events on

# Keep app/window names under your control.
set -g allow-rename off
setw -g automatic-rename off

##### Copy mode bindings #####

# Vim-like selection in copy mode.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

##### Colored status line #####

set -g status on
set -g status-position bottom
set -g status-interval 15
set -g status-justify left

# Calm dark base.
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left-style default
set -g status-right-style default

set -g status-left-length 60
set -g status-right-length 140

# tmux messages and copy-mode selection.
set -g message-style 'bg=#f9e2af,fg=#1e1e2e,bold'
set -g message-command-style 'bg=#89b4fa,fg=#1e1e2e,bold'
set -g mode-style 'bg=#89b4fa,fg=#1e1e2e,bold'

# Pane borders.
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'

# Left: prefix warning + session name.
# Inside #{?...}, use space-separated styles to avoid escaping commas.
set -g status-left '#{?client_prefix,#[bg=#f38ba8 fg=#1e1e2e bold] PREFIX #[default] ,}#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] '

# Window list.
set -g window-status-separator ' '
set -g window-status-style 'fg=#a6adc8,bg=#1e1e2e'
set -g window-status-current-style 'fg=#1e1e2e,bg=#f9e2af,bold'
set -g window-status-activity-style 'fg=#f9e2af,bold'
set -g window-status-bell-style 'fg=#f38ba8,bold'

set -g window-status-format ' #I:#W#{?window_flags,#{window_flags},} '
set -g window-status-current-format ' #I:#W#{?window_flags,#{window_flags},} '

# Right: important states, path, time.
# SYNC and ZOOM are intentionally bright because they are important state warnings.
set -g status-right '#{?pane_synchronized,#[bg=#f38ba8 fg=#1e1e2e bold] SYNC #[default] ,}#{?window_zoomed_flag,#[bg=#f9e2af fg=#1e1e2e bold] ZOOM #[default] ,}#[fg=#a6adc8]#{=45:pane_current_path} #[bg=#89b4fa,fg=#1e1e2e,bold] %H:%M %d-%b '

##### Project-friendly bindings #####

# Reload config with: prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Splits/new windows inherit the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Easier pane movement with Alt-arrow.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with prefix + H/J/K/L.
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Toggle pane synchronization only when deliberately needed.
bind S setw synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,on,off}"

##### Plugin policy #####

# This project currently does not use tmux plugins.
